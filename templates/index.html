<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050b13">
  <title>J.A.R.V.I.S. — Intelligence Interface</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    :root {
      color-scheme: dark;
      --bg:#050a11; --panel:rgba(9,22,35,.88); --panel2:rgba(11,31,47,.76);
      --cyan:#54eaff; --blue:#239bdb; --muted:#83a8b8; --line:rgba(69,211,241,.27);
      --glow:0 0 18px rgba(48,207,244,.18), inset 0 0 22px rgba(32,160,204,.035);
    }
    * { box-sizing:border-box }
    body {
      margin:0; min-height:100vh; color:#d9f8ff; background:
        radial-gradient(ellipse at 50% 42%,rgba(9,91,125,.18),transparent 48%),
        radial-gradient(ellipse at 5% 0%,rgba(0,119,180,.12),transparent 38%),
        linear-gradient(135deg,#03070d,#071321 55%,#03080f);
      font-family:'Rajdhani',sans-serif; letter-spacing:.35px; overflow-x:hidden;
    }
    body:before {
      content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.16;
      background-image:linear-gradient(rgba(75,206,237,.09) 1px,transparent 1px),
        linear-gradient(90deg,rgba(75,206,237,.09) 1px,transparent 1px);
      background-size:42px 42px;
      mask-image:linear-gradient(to bottom,black,transparent 92%);
    }
    body:after {
      content:""; position:fixed; inset:0; pointer-events:none; z-index:5; opacity:.12;
      background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(115,228,255,.07) 4px,transparent 5px);
    }
    .shell { position:relative; z-index:1; display:grid; grid-template-columns:290px minmax(0,1fr); gap:18px; max-width:1600px; min-height:100vh; margin:auto; padding:22px; }
    .side,.chat {
      border:1px solid var(--line); background:var(--panel); box-shadow:var(--glow);
      backdrop-filter:blur(16px); position:relative;
    }
    .side { padding:25px 21px; display:flex; flex-direction:column; gap:28px; min-height:calc(100vh - 44px); }
    .side:before,.chat:before { content:""; position:absolute; top:-1px; left:18px; width:76px; height:2px; background:var(--cyan); box-shadow:0 0 12px var(--cyan); }
    .side:after,.chat:after { content:""; position:absolute; right:0; bottom:0; width:35px; height:35px; border-right:2px solid rgba(84,234,255,.6); border-bottom:2px solid rgba(84,234,255,.6); }
    .brand-mark { width:56px; height:56px; border:1px solid rgba(84,234,255,.65); border-radius:50%; display:grid; place-items:center; color:var(--cyan); font:700 19px Orbitron,sans-serif; box-shadow:0 0 22px rgba(84,234,255,.2),inset 0 0 15px rgba(84,234,255,.12); margin-bottom:17px; }
    h1 { font:600 19px Orbitron,sans-serif; letter-spacing:2px; color:#e9fcff; margin:0; }
    .lede { color:var(--muted); font-size:16px; line-height:1.45; margin:10px 0 0; }
    .eyebrow { color:var(--cyan); font:500 10px Orbitron,sans-serif; letter-spacing:2px; text-transform:uppercase; margin:0 0 8px; }
    section { border-top:1px solid rgba(84,234,255,.16); padding-top:17px; }
    h2 { color:#b9eff8; font:500 11px Orbitron,sans-serif; letter-spacing:1.7px; text-transform:uppercase; margin:0 0 14px; }
    .files { list-style:none; margin:0; padding:0; color:#b7dce5; font-size:15px; }
    .files li { padding:9px 10px; margin:5px 0; border-left:2px solid rgba(84,234,255,.45); background:rgba(35,151,190,.07); }
    .pick { display:block; padding:13px 12px; border:1px dashed rgba(84,234,255,.5); background:rgba(29,135,171,.08); color:#c9f7ff; cursor:pointer; text-align:center; font-size:15px; transition:.2s; }
    .pick:hover { background:rgba(29,172,211,.17); border-color:var(--cyan); box-shadow:0 0 16px rgba(84,234,255,.12); }
    #upload-status { color:var(--muted); font-size:13px; min-height:18px; }
    button { font-family:'Orbitron',sans-serif; cursor:pointer; letter-spacing:1px; transition:.2s; }
    .quiet { margin-top:auto; width:100%; padding:13px 10px; color:#9ccbd6; border:1px solid rgba(84,234,255,.27); background:rgba(8,24,37,.8); font-size:10px; }
    .quiet:hover { color:#fff; border-color:var(--cyan); box-shadow:0 0 16px rgba(84,234,255,.16); }
    .chat { min-height:calc(100vh - 44px); display:flex; flex-direction:column; padding:0; overflow:hidden; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:18px; padding:19px 25px; border-bottom:1px solid rgba(84,234,255,.18); background:rgba(7,19,30,.68); }
    .top-title { font:500 13px Orbitron,sans-serif; letter-spacing:2px; color:#dffaff; }
    .top-sub { color:#729eae; font-size:13px; margin-top:5px; letter-spacing:1px; }
    .system-state { display:flex; align-items:center; gap:9px; color:#8de9f5; font:500 10px Orbitron,sans-serif; letter-spacing:1px; white-space:nowrap; }
    .dot { width:7px; height:7px; border-radius:50%; background:#58f5cb; box-shadow:0 0 10px #58f5cb; animation:pulse 1.8s infinite; }
    @keyframes pulse { 50% { opacity:.35; box-shadow:0 0 3px #58f5cb; } }
    .log { flex:1; min-height:300px; padding:30px clamp(18px,4vw,55px); overflow:auto; color:#d9f6fb; font-size:17px; }
    .log:empty:before { content:"J.A.R.V.I.S."; display:block; text-align:center; margin:8vh auto 12px; color:rgba(84,234,255,.7); font:500 clamp(20px,3vw,32px) Orbitron,sans-serif; letter-spacing:7px; text-shadow:0 0 20px rgba(84,234,255,.45); }
    .log:empty:after { content:"INTELLIGENCE SYSTEM READY  /  AWAITING YOUR QUERY"; display:block; text-align:center; color:#648d9e; font:10px Orbitron,sans-serif; letter-spacing:2px; }
    .suggestions { display:flex; flex-wrap:wrap; gap:9px; padding:0 clamp(18px,4vw,55px) 17px; }
    .suggestions button { border:1px solid rgba(84,234,255,.25); background:rgba(23,102,132,.12); color:#a9eaf4; padding:9px 13px; font:500 10px Rajdhani,sans-serif; letter-spacing:.7px; }
    .suggestions button:hover { border-color:var(--cyan); color:#fff; background:rgba(35,165,205,.2); }
    .composer { display:flex; align-items:flex-end; gap:12px; padding:18px 22px 22px; border-top:1px solid rgba(84,234,255,.2); background:rgba(4,13,22,.86); }
    textarea { flex:1; resize:vertical; min-height:48px; max-height:180px; padding:14px 16px; color:#e4fbff; background:rgba(7,24,37,.95); border:1px solid rgba(84,234,255,.3); outline:none; font:500 16px Rajdhani,sans-serif; }
    textarea:focus { border-color:var(--cyan); box-shadow:0 0 15px rgba(84,234,255,.13); }
    textarea::placeholder { color:#668b9b; }
    #send { min-height:48px; padding:0 23px; color:#031018; background:linear-gradient(135deg,#9af5ff,#36b9e6); border:1px solid #a7f7ff; font-size:10px; box-shadow:0 0 17px rgba(54,185,230,.24); }
    #send:hover { filter:brightness(1.13); box-shadow:0 0 25px rgba(84,234,255,.4); transform:translateY(-1px); }
    /* Keep chat output readable when the existing script adds common message elements. */
    .log p { line-height:1.55; }
    .log a { color:var(--cyan); }
    .log pre,.log code { color:#a9f5ff; background:rgba(1,10,17,.8); border:1px solid rgba(84,234,255,.15); }
    @media (max-width:800px) {
      .shell { grid-template-columns:1fr; padding:12px; gap:12px; }
      .side { min-height:unset; gap:18px; padding:19px; }
      .quiet { margin-top:0; }
      .chat { min-height:70vh; }
      .topbar { padding:15px; }
      .system-state { font-size:8px; }
    }
    @media (max-width:480px) {
      .composer { padding:12px; gap:8px; }
      #send { padding:0 13px; }
      .top-sub { font-size:11px; }
      .system-state { letter-spacing:0; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <header>
        <div class="brand-mark" aria-hidden="true">J</div>
        <p class="eyebrow">Stark Industries // AI</p>
        <h1>J.A.R.V.I.S.</h1>
        <p class="lede">Just A Rather Very Intelligent System. Your data intelligence interface.</p>
      </header>

      <section>
        <h2>Knowledge archive</h2>
        <ul id="datasets" class="files"></ul>
      </section>

      <section>
        <h2>Ingest data</h2>
        <label class="pick" for="file">＋ &nbsp; LOAD DATA SOURCE<br><small>CSV · EXCEL · TEXT · MARKDOWN</small></label>
        <input id="file" type="file" accept=".csv,.xlsx,.txt,.md" hidden>
        <p id="upload-status" role="status"></p>
      </section>

      <button id="reset" type="button" class="quiet">↻ &nbsp; NEW SESSION</button>
    </aside>

    <main class="chat">
      <div class="topbar">
        <div>
          <div class="top-title">INTELLIGENCE CORE</div>
          <div class="top-sub">DATA ANALYSIS &amp; KNOWLEDGE INTERFACE</div>
        </div>
        <div class="system-state"><span class="dot"></span> SYSTEM ONLINE</div>
      </div>
      <div id="log" class="log" aria-live="polite"></div>
      <div id="suggestions" class="suggestions"></div>
      <form id="composer" class="composer">
        <textarea id="input" rows="1" placeholder="Ask J.A.R.V.I.S. about your data..." aria-label="Your question"></textarea>
        <button id="send" type="submit">TRANSMIT ↗</button>
      </form>
    </main>
  </div>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
